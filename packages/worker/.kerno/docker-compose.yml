services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=budibase"
      - "POSTGRES_PASSWORD=budibase"
      - "POSTGRES_DB=budibase"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U budibase -d budibase"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/budibase?user=budibase&password=budibase

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        FROM node:22-alpine

        LABEL com.centurylinklabs.watchtower.lifecycle.pre-check="scripts/watchtower-hooks/pre-check.sh"
        LABEL com.centurylinklabs.watchtower.lifecycle.pre-update="scripts/watchtower-hooks/pre-update.sh"
        LABEL com.centurylinklabs.watchtower.lifecycle.post-update="scripts/watchtower-hooks/post-update.sh"
        LABEL com.centurylinklabs.watchtower.lifecycle.post-check="scripts/watchtower-hooks/post-check.sh"


        # handle node-gyp
        RUN apk add --no-cache --virtual .gyp python3 make g++ \
            && apk add --no-cache \
                jq \
                procps \
                iproute2 \
                curl \
                bind-tools \
                netcat-openbsd \
                openssl \
                lsof \
                strace \
                less \
                coreutils \
                tzdata
        RUN yarn global add pm2 typescript

        WORKDIR /

        COPY scripts/removeWorkspaceDependencies.sh scripts/removeWorkspaceDependencies.sh
        RUN chmod +x ./scripts/removeWorkspaceDependencies.sh

        WORKDIR /app
        COPY packages/worker/package.json .
        
        # Create a minimal yarn.lock
        RUN echo '# yarn lockfile v1' > yarn.lock

        # Don't remove workspace dependencies - we need them
        # RUN ../scripts/removeWorkspaceDependencies.sh package.json

        ARG TARGETPLATFORM
        
        # Copy workspace dependencies that are referenced
        COPY packages/backend-core /packages/backend-core
        COPY packages/types /packages/types
        COPY packages/shared-core /packages/shared-core
        COPY packages/pro /packages/pro
        COPY packages/string-templates /packages/string-templates
        
        # Install all dependencies including dev dependencies for build
        RUN --mount=type=cache,target=/root/.yarn/${TARGETPLATFORM} YARN_CACHE_FOLDER=/root/.yarn/${TARGETPLATFORM} yarn install
        
        # Copy source files
        COPY packages/worker/src ./src
        COPY packages/worker/tsconfig*.json ./
        
        # Build with esbuild for simpler compilation
        RUN yarn add -D esbuild && \
            npx esbuild src/index.ts --bundle --platform=node --format=cjs --outfile=dist/index.js --external:@budibase/* --external:koa --external:koa-* --external:passport-* --external:bull --external:dd-trace --external:pouchdb* --external:nodemailer --external:aws-sdk --external:bcrypt --external:jsonwebtoken --external:knex --external:global-agent --external:http-graceful-shutdown --external:ical-generator --external:joi --external:lodash --external:marked --external:node-fetch --external:scim* --external:server-destroy --external:undici --external:uuid --external:yaml --target=es2020
        
        # Now reinstall only production dependencies
        RUN yarn install --production --force
        
        # Remove unneeded data from file system to reduce image size
        RUN apk del .gyp \
            && yarn cache clean

        COPY packages/worker/docker_run.sh .
        COPY packages/server/pm2.config.js .
        
        RUN chmod +x ./docker_run.sh

        EXPOSE 4001

        # have to add node environment production after install
        # due to this causing yarn to stop installing dev dependencies
        # which are actually needed to get this environment up and running
        ENV NODE_ENV=production
        # this is required for isolated-vm to work on Node 20+
        ENV NODE_OPTIONS="--no-node-snapshot"
        ENV CLUSTER_MODE=${CLUSTER_MODE}
        ENV SERVICE=worker-service
        ENV POSTHOG_TOKEN=phc_bIjZL7oh2GEUd2vqvTBH8WvrX0fWTFQMs6H5KQxiUxU
        ENV ACCOUNT_PORTAL_URL=https://account.budibase.app

        ARG BUDIBASE_VERSION=1.0.0
        ARG GIT_COMMIT_SHA
        # Ensuring the version argument is sent
        RUN test -n "$BUDIBASE_VERSION"
        ENV BUDIBASE_VERSION=$BUDIBASE_VERSION
        ENV DD_GIT_REPOSITORY_URL=https://github.com/budibase/budibase
        ENV DD_GIT_COMMIT_SHA=$GIT_COMMIT_SHA
        ENV DD_VERSION=$BUDIBASE_VERSION

        CMD ["./docker_run.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4001"
    labels:
      - jwt-signing-config=HS256:${JWT_SECRET}
