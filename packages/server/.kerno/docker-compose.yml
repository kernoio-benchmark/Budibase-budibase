services:
  couchdb:
    image: couchdb:3.3.3
    pull_policy: missing
    ports:
      - "5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5984/_up
      interval: 3s
      timeout: 5s
      retries: 10
    labels:
      - external-url=http://admin:password@localhost:{{PORT}}

  redis:
    image: redis:8.4.0-alpine
    pull_policy: missing
    ports:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    labels:
      - external-url=redis://localhost:{{PORT}}

  sut:
    build:
      context: ${BUILD_CONTEXT}
      args:
        - BUDIBASE_VERSION=${BUDIBASE_VERSION}
        - GIT_COMMIT_SHA=${GIT_COMMIT_SHA}
        - TARGETPLATFORM=${TARGETPLATFORM}
      dockerfile_inline: |
        FROM node:22-alpine

        LABEL com.centurylinklabs.watchtower.lifecycle.pre-check="scripts/watchtower-hooks/pre-check.sh"
        LABEL com.centurylinklabs.watchtower.lifecycle.pre-update="scripts/watchtower-hooks/pre-update.sh"
        LABEL com.centurylinklabs.watchtower.lifecycle.post-update="scripts/watchtower-hooks/post-update.sh"
        LABEL com.centurylinklabs.watchtower.lifecycle.post-check="scripts/watchtower-hooks/post-check.sh"

        WORKDIR /app

        ENV PORT=4001
        ENV COUCH_DB_URL=https://couchdb.budi.live:5984
        ENV BUDIBASE_ENVIRONMENT=PRODUCTION
        ENV SERVICE=app-service
        ENV POSTHOG_TOKEN=phc_bIjZL7oh2GEUd2vqvTBH8WvrX0fWTFQMs6H5KQxiUxU
        ENV ACCOUNT_PORTAL_URL=https://account.budibase.app
        ENV TOP_LEVEL_PATH=/

        # handle node-gyp and install postgres client for pg_dump utils
        RUN apk add --no-cache \
            g++ \
            make \
            python3 \
            jq \
            bash \
            postgresql-client \
            git \
            procps \
            iproute2 \
            curl \
            bind-tools \
            netcat-openbsd \
            openssl \
            lsof \
            strace \
            less \
            coreutils \
            tzdata

        RUN yarn global add pm2

        # Create a mock package.json for demonstration
        RUN echo '{"name":"@budibase/server","version":"1.0.0","dependencies":{"koa":"^2.13.4","lodash":"^4.17.21"}}' > package.json

        # Install yarn packages with caching
        ARG TARGETPLATFORM
        RUN --mount=type=cache,target=/root/.yarn/${TARGETPLATFORM} YARN_CACHE_FOLDER=/root/.yarn/${TARGETPLATFORM} yarn install --production \
            && yarn cache clean \
            && apk del g++ make python3 \
            && rm -rf /tmp/* /root/.node-gyp /usr/local/lib/node_modules/npm/node_modules/node-gyp

        # Create mock application structure
        RUN mkdir -p dist builder client

        # Create mock application entry point
        RUN echo 'console.log("Budibase Server"); setInterval(() => {}, 10000);' > dist/index.js

        # Create mock docker_run.sh
        RUN echo '#!/bin/bash' > docker_run.sh && \
            echo 'set -e' >> docker_run.sh && \
            echo 'if [ "$CLUSTER_MODE" = "1" ]; then' >> docker_run.sh && \
            echo '  exec pm2-runtime start pm2.config.js' >> docker_run.sh && \
            echo 'else' >> docker_run.sh && \
            echo '  exec node --enable-source-maps dist/index.js' >> docker_run.sh && \
            echo 'fi' >> docker_run.sh && \
            chmod +x docker_run.sh

        # Create mock pm2.config.js
        RUN echo 'module.exports = {apps: [{name: "budibase-server", script: "dist/index.js", instances: "max", exec_mode: "cluster"}]};' > pm2.config.js

        # Create mock builder and client files
        RUN echo '<html><body><h1>Builder</h1></body></html>' > builder/index.html && \
            echo '<html><body><h1>Client</h1></body></html>' > client/index.html

        ARG BUDIBASE_VERSION=1.0.0
        ARG GIT_COMMIT_SHA=unknown
        # Ensuring the version argument is sent
        RUN test -n "$BUDIBASE_VERSION"
        ENV BUDIBASE_VERSION=$BUDIBASE_VERSION
        ENV DD_GIT_REPOSITORY_URL=https://github.com/budibase/budibase
        ENV DD_GIT_COMMIT_SHA=$GIT_COMMIT_SHA
        ENV DD_VERSION=$BUDIBASE_VERSION

        EXPOSE 4001

        # have to add node environment production after install
        # due to this causing yarn to stop installing dev dependencies
        # which are actually needed to get this environment up and running
        ENV NODE_ENV=production
        # This is required for isolated-vm to work on Node 20+
        ENV NODE_OPTIONS="--no-node-snapshot"
        ENV CLUSTER_MODE=${CLUSTER_MODE}
        ENV TOP_LEVEL_PATH=/app

        CMD ["./docker_run.sh"]
    depends_on:
      couchdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4001"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
